// Compose compiler stability configuration.
//
// Kotlin 1.9.22 / compose-compiler 1.5.8 is before strong skipping, so a composable taking any type
// the compiler cannot prove stable is unconditionally non-skippable - and a `data class` holding a
// `List` is never provably stable. That is what turned one coarse progress read in the Achievement
// Journey player into a whole-subtree re-execution seven times a second.
//
// Everything named here is a build-once value object: every field is a `val`, every collection is
// handed over already finished and never written to again, and the instance is replaced rather than
// mutated when the journey changes. Declaring them stable is therefore a statement of what they
// already are, not a promise being made on their behalf - but it IS a promise, so anything added to
// these packages has to keep it.

// The journey's chart geometry: ChartLayout, CurveLayout, NodeLayout, MedalLayout, FlameLayout, P.
// All built by LayoutEngine in one pass and then read-only for the life of the layout.
com.twinlore.app.journey.domain.*

// The journey itself: JourneyFrame, PlayerJourney, Unlock, GameSnapshot, Medal and friends. Built by
// JourneyBuilder off an immutable fetch result.
com.twinlore.app.journey.domain.model.*

// The chart's palette, resolved once from the theme, and the measured paths built once per layout.
com.twinlore.app.journey.ui.chart.ChartStyle
com.twinlore.app.journey.ui.chart.ChartPaths

// The screen's published state. Ready is assembled off the main thread and handed over whole; its
// per-player rank map is a defensive copy of the ViewModel's, never the ViewModel's own instance.
com.twinlore.app.journey.ui.JourneyUiState
com.twinlore.app.journey.ui.JourneyUiState.*
com.twinlore.app.journey.ui.JourneyControls
com.twinlore.app.journey.ui.JourneyContext
com.twinlore.app.journey.ui.RankChip
com.twinlore.app.journey.ui.BackdropArgs
